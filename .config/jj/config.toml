#:schema https://docs.jj-vcs.dev/latest/config-schema.json

[user]
name = "Seth McLean"
email = "379763+sethamclean@users.noreply.github.com"

[ui]
default-command = "log"
editor = "nvim"
diff-formatter = ":git"

[aliases]
push = ["git", "push"]

[colors]
commit_id = "#89b4fa"
change_id = "#f5c2e7"
bookmark = "#f9e2af"
tag = "#f9e2af"
working_copy = { fg = "#a6e3a1", bold = true }
"working_copy commit_id" = { fg = "#a6e3a1", bold = true }
"immutable commit_id" = "#94e2d5"
author = "#cdd6f4"
description = "#cdd6f4"
timestamp = "#bac2de"
"diff added" = "#a6e3a1"
"diff removed" = "#f38ba8"
"diff added token" = { bg = "#1f2d24", underline = false }
"diff removed token" = { bg = "#38232f", underline = false }
"diff context" = { fg = "#6c7086" }
"diff hunk_header" = "#89b4fa"
